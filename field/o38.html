/* Layout: 컨설팅 보고서처럼 흰 바탕 + 네이비 한 가지 강조색, 얇은 구분선과 표로 정보를 정리 */
:root{
  --bg:#ffffff; --surface:#f3f6fa; --ink:#121a2b; --muted:#566275; --line:#dde3eb;
  --accent:#00449a; --accent-ink:#ffffff; --accent-soft:#e9effa; --bar:#b9c8e6;
  --font:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --fs-xs:.8125rem; --fs-s:.9375rem; --fs-m:1.0625rem; --fs-l:1.375rem; --fs-xl:clamp(1.6rem,3.2vw,2.1rem); --fs-xxl:clamp(2.1rem,5vw,3.1rem);
  --maxw:1120px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d121b; --surface:#151c29; --ink:#e7ecf4; --muted:#9ba7b9; --line:#273145;
  --accent:#8db0ff; --accent-ink:#0d121b; --accent-soft:#18233a; --bar:#34507f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d121b; --surface:#151c29; --ink:#e7ecf4; --muted:#9ba7b9; --line:#273145;
  --accent:#8db0ff; --accent-ink:#0d121b; --accent-soft:#18233a; --bar:#34507f; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-m);line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
img{max-width:100%;display:block}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{line-height:1.3;text-wrap:balance;letter-spacing:-.02em;margin:0}
p{margin:0}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:16px;background:var(--bg);padding:8px 12px;z-index:30}
.sel{user-select:all}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink)}

.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{color:var(--ink);text-decoration:none;font-size:var(--fs-s);font-weight:600;padding:6px 10px;border-radius:6px}
.nav a:hover{background:var(--surface)}
.nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* sections */
.section{padding-block:64px;border-bottom:1px solid var(--line)}
.section.tint{background:var(--surface)}
.eyebrow{font-size:var(--fs-xs);font-weight:700;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
.h2{font-size:var(--fs-xl);font-weight:800}
.lede{color:var(--muted);margin-top:10px;max-width:62ch}

/* hero */
.hero{padding-block:56px 48px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:48px;align-items:center}

.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:8px;font-weight:700;font-size:var(--fs-s);text-decoration:none;border:1px solid var(--accent);cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);color:var(--accent-ink)}

.portrait{position:relative;max-width:300px;justify-self:end;width:100%}
.portrait img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:4px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);margin-top:44px}
.stat{padding:20px 20px 4px 0}

.stat .num{font-size:clamp(1.8rem,4vw,2.4rem);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--accent)}

.stat .note{font-size:var(--fs-xs);color:var(--muted)}

/* program list */
.cat{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;padding-block:28px;border-top:1px solid var(--line)}
.cat:first-of-type{border-top:0;padding-top:0}

/* episodes & field */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{display:flex;flex-direction:column;gap:10px;color:var(--ink);text-decoration:none}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.card .k{font-size:var(--fs-xs);font-weight:700;color:var(--accent);letter-spacing:.04em}
.card .t{font-weight:800;line-height:1.45}
.card .d{font-size:var(--fs-s);color:var(--muted)}
.tag{display:inline-block;font-size:var(--fs-xs);font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}

/* contact band */
.band{background:var(--accent);color:var(--accent-ink)}
.band .wrap{padding-block:48px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.band h2{font-size:var(--fs-xl);font-weight:800}
.band p{opacity:.85;margin-top:6px}
.band .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}

/* page head */
.page-head{padding-block:48px 32px;border-bottom:1px solid var(--line)}
.page-head h1{font-size:var(--fs-xxl);font-weight:800}
.crumb{font-size:var(--fs-s);color:var(--muted);margin-bottom:12px}
.crumb a{color:var(--muted)}

/* course detail */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:8px;margin-top:28px;overflow:hidden}
.fact{padding:14px 18px}
.fact + .fact{border-left:1px solid var(--line)}
.fact dt{font-size:var(--fs-xs);color:var(--muted);font-weight:700}
.fact dd{margin:2px 0 0;font-weight:700}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:48px;align-items:start}
.agenda{width:100%;border-collapse:collapse;font-size:var(--fs-s)}

.agenda ul{margin:0;padding-left:18px}
.hbar{height:6px;border-radius:3px;background:var(--bar);margin-top:6px}
.side{position:sticky;top:90px;display:flex;flex-direction:column;gap:20px}
.box{border:1px solid var(--line);border-radius:8px;padding:20px}
.box h3{font-size:var(--fs-m);font-weight:800;margin-bottom:10px}
.box ul{margin:0;padding-left:18px;font-size:var(--fs-s)}
.box li + li{margin-top:4px}
.note-s{font-size:var(--fs-xs);color:var(--muted)}
.table-scroll{overflow-x:auto}

/* profile */
.prof-grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:48px;align-items:start}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.timeline .per{font-variant-numeric:tabular-nums;color:var(--muted);font-size:var(--fs-s)}
.timeline .org{font-weight:800}
.timeline .rl{font-size:var(--fs-s);color:var(--muted)}
.blocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.blocks h3{font-size:var(--fs-m);font-weight:800;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:var(--fs-xs);padding:4px 10px;border:1px solid var(--line);border-radius:999px}
.feat h3{font-size:var(--fs-m);font-weight:800;margin:24px 0 8px}
.feat ul{margin:0;padding-left:18px}
.clients{font-size:var(--fs-s);color:var(--muted)}
.strengths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
.strengths h3{font-size:var(--fs-m);font-weight:800;margin-bottom:6px}
.strengths p{font-size:var(--fs-s);color:var(--muted)}

/* history & reviews */
.hist-list{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.hist-list li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:2px 14px;padding:12px 0;border-bottom:1px solid var(--line)}

.rev-card{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-decoration:none}
.rev-card:hover{border-color:var(--accent)}
.rev-card .k{font-size:var(--fs-xs);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.rev-card .t{font-weight:800;line-height:1.45}
.rev-card .d{font-size:var(--fs-s);color:var(--muted)}
.yr{font-size:var(--fs-l);font-weight:800;margin:32px 0 10px}

.prose h2{font-size:var(--fs-l);font-weight:800;margin:28px 0 8px}
.prose h3{font-size:var(--fs-m);font-weight:800;margin:24px 0 6px}
.prose ul{padding-left:20px}
.prose li + li{margin-top:4px}

/* contact */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:var(--fs-s);font-weight:700;margin-bottom:6px}
.form input,.form select,.form textarea{width:100%;font:inherit;font-size:var(--fs-s);padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.form textarea{min-height:120px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-size:var(--fs-s)}

.contact-list{display:grid;gap:14px}
.contact-list .row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;flex-wrap:wrap}
.copy{font:inherit;font-size:var(--fs-xs);font-weight:700;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}
.prose{max-width:70ch}
.prose p + p{margin-top:14px}
.prose figure{margin:0 0 24px}
.prose figcaption{font-size:var(--fs-xs);color:var(--muted);margin-top:6px}

.site-foot{background:var(--surface);border-top:1px solid var(--line)}

.foot-meta,.foot-contact{color:var(--muted)}

/* 고객사 · 연도별 이력 */
.org-chips{display:flex;flex-wrap:wrap;gap:8px}
.org-chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:var(--fs-s);color:var(--ink);text-decoration:none;background:var(--bg)}

:root{--brand:#00449a}
