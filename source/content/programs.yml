      팔로워십, 상호신뢰를 한 과정으로 묶었습니다.
    modules:
      - name: 중간관리자에게 요구되는 리더십
        hours: 0.5H
        points: [좋은 리더 선배 vs 꼰대, 가교형 리더십·영향력·팔로워십]
      - name: 가교형 리더십(소통)
        hours: 1.0H
        points: [차이를 인정하는 소통, 세대별 생각 차이 5가지 주제]
      - name: 성과관리 — 리더 측면
        hours: 3.5H
        points: [임파워먼트 전략, 동기부여, 구조화된 업무지시, 업무 위임과 코칭]
      - name: 성과관리 — 팔로워 측면
        hours: 1.0H
        points: [시간관리와 우선순위, 1일 계획표]
      - name: 상호신뢰
        hours: 1.0H
        points: [신뢰의 원천, 나만의 원칙 만들기]
    signature: [이영자와 매니저(임파워먼트), 양세형 사원의 하루, 진실을 말할 것인가]
    records: [건강보험심사평가원 넥스트 리더 (13차수), CJ텔레닉스 중간관리자 리더십 (4차수), 삼성디스플레이 승격자 과정 (5차수)]

  - slug: ai-leadership
    cat: leadership
    title: AI 시대의 리더십
    subtitle: 지시의 기술에서 검증의 리더십으로
    target: 팀장·임원, AI 도입 조직의 리더
    hours: 4.5~6시간 워크숍
    summary: >-
      프롬프트를 '업무지시의 기술'로 다루고, AI가 만든 결과를 검증하는 비판적 의사결정,
      AI 도입기에 불안한 구성원을 이끄는 감성 리더십과 우리 조직의 AI 활용 원칙까지 만듭니다.
    modules:
      - name: 리더십의 진화와 AX 마인드셋
        hours: 1.0H
        points: [지시형 → 참여형 → 생성형 리더십, 프롬프트의 6요소, 프롬프트 노하우 공유]
      - name: 의사결정(비판적 사고)
