courses:
  - slug: team-leader-leadership
    cat: leadership
    title: 팀장 리더십
    subtitle: 체스마스터형이 아닌 정원사형 리더로
    target: 신임·예비 팀장, 팀장 승진자
    hours: 8시간 (16시간 확장형 가능)
    summary: >-
      팀원의 성숙도에 맞춰 동기부여·업무지시·위임·코칭을 선택하는 성과창출 리더십과,
      소통·신뢰를 바탕으로 한 조직관리를 사례와 실습 중심으로 다룹니다.
    modules:
      - name: 리더의 역할과 리더십 이해
        hours: 0.5H
        points: [달라진 세상 vs 달라지지 않은 리더, 리더의 역할(성과관리·조직관리), 리더의 유형 — 체스마스터형 vs 정원사형]
      - name: 성과창출 — 임파워먼트
        hours: 4.0H
        points: [팀원 성숙도에 따른 전략 선택, 동기부여(내적 동기 6요인), 구조화된 업무지시(What·Why·How), 업무 위임 시나리오와 롤플레이, 코칭(관찰·질문·피드백)]
      - name: 소통과 협업
        hours: 2.0H
        points: [장자로부터 배우는 소통의 지혜, 세대 간 생각 차이와 소통, 협업 구축의 3요소]
      - name: 신뢰
        hours: 1.5H
        points: ["원칙과 신뢰 — '진실을 말할 것인가'", 나만의 리더 원칙 만들기, 신뢰의 원천(역량·관계·행동), 변화 실천계획]
    signature: [정원사들의 일하는 방식, 지식의 저주(박자 맞히기), 진실을 말할 것인가, 블럭 쌓기 게임]
    records: [경찰청 중간관리자 리더십 (15차수), 삼성전자 변화리더 과정 (7차수), SPC그룹 예비팀장 과정 (5차수), 현대로템 예비리더 과정 (6차수)]

  - slug: bridge-leadership
