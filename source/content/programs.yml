      - name: 팀 관리(감성 리더십)
        hours: 1.5~2.0H
        points: ["AI 리터러시 코칭", "심리적 안전감과 변화관리", "데이터 기반 1:1 면담 설계"]
      - name: AI 활용 원칙
        hours: 1.0H
        points: [우리 회사의 AI 활용 원칙 수립(워크숍 결과물)]
    signature: [밀그램의 실험, 진실을 말할 것인가, AI 활용 10계명]
